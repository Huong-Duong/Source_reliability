name: Update source reliability list

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]
  schedule:
    - cron: '0 7 * * 0'
  # Allows you to run this workflow manually from the Actions tab
  workflow_dispatch:

jobs:
  run-app-and-save:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository code
        uses: actions/checkout@v4

      - name: Install uv
        uses: astral-sh/setup-uv@v3
        with:
          enable-cache: true
          version: "latest"

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version-file: ".python-version"
          
      - name: Install dependencies
        run: |
          uv sync

      - name: Run application
        run: |
          uv run run_app

      - name: Commit and push updated source_reliability.json
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "github-actions[bot]@users.noreply.github.com"

          if git status --porcelain source_reliability.json | grep -q .; then
            echo "There are changes to source_reliability.json. Saving..."
            git add source_reliability.json
            git commit -m "auto: Update source reliability list [skip ci]"
            git push
          else
            echo "No change on source_reliability.json."
          fi
